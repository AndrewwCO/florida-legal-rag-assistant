<!DOCTYPE html>
<html>

<head>

<title>Florida Legal Assistant</title>

<style>

body{
font-family: Arial;
background:#0f172a;
color:white;
margin:0;
}

.container{
display:flex;
height:100vh;
}

.chat{
flex:3;
padding:20px;
}

.history{
flex:1;
background:#1e293b;
padding:20px;
overflow-y:auto;
}

input{
width:80%;
padding:10px;
border-radius:8px;
border:none;
}

button{
padding:10px 20px;
border:none;
border-radius:8px;
background:#22c55e;
color:white;
cursor:pointer;
}

.message{
margin:10px 0;
padding:10px;
background:#1e293b;
border-radius:8px;
}

</style>

</head>

<body>

<div class="container">

<div class="chat">

<h2>⚖️ Florida Real Estate Legal Assistant</h2>

<div id="messages"></div>

<input id="input" placeholder="Ask a legal question...">
<button onclick="sendMessage()">Send</button>

</div>

<div class="history">

<h3>History</h3>

<div id="history"></div>

</div>

</div>

<script>

async function sendMessage(){

let input=document.getElementById("input")

let mensaje=input.value

input.value=""

let res=await fetch("/chat",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({mensaje})
})

let data=await res.json()

let messages=document.getElementById("messages")

messages.innerHTML+=`<div class="message"><b>You:</b> ${mensaje}</div>`

messages.innerHTML+=`<div class="message"><b>Assistant:</b> ${data.respuesta}</div>`

let history=document.getElementById("history")

history.innerHTML=""

data.historial.forEach(item=>{

history.innerHTML+=`
<div class="message">
<b>Q:</b> ${item.pregunta}<br>
<b>A:</b> ${item.respuesta.substring(0,120)}...
</div>
`

})

}

</script>

</body>

</html>
